# Subir ambiente em desenvolvimento
# Run: docker-compose up --build -d
# Stop: docker-compose down

services:
  todo-mongodb:
    image: mongo:6
    container_name: todo-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - D:/Development/Docker/todo-app/volumes/mongodb/data:/data/db
    networks:
      - todo-network
  
  todo-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: todo-backend
    ports:
      - '3000:3000'
    depends_on:
      - todo-mongodb
    volumes:
      - ../../backend:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://todo-mongodb:27017/todo
      - JWT_SECRET=superSecretKey123
      - JWT_EXPIRES_IN=3600s
    networks:
      - todo-network

  todo-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    ports:
      - '3001:3001'
    depends_on:
      - todo-backend
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://todo-backend:3000
    networks:
      - todo-network
  
networks:
  todo-network:
    name: todo-network
    driver: bridge