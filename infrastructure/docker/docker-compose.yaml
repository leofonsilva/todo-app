# Subir ambiente em desenvolvimento
# Run: docker-compose up -d
# Stop: docker-compose down
# View logs: docker-compose logs -f
# Access Mongo Express: http://localhost:8081

services:
  todo-mongo-db:
    image: mongo:7
    container_name: todo-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ${MONGO_VOLUME_PATH}:/data/db
    networks:
      - todo-network

  todo-mongo-express:
    image: mongo-express:latest
    container_name: todo-mongo-express
    restart: unless-stopped
    ports:
      - "${ME_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/
      ME_CONFIG_BASICAUTH: false
      ME_CONFIG_MONGODB_ENABLE_ADMIN: true
    depends_on:
      - todo-mongo-db
    networks:
      - todo-network

networks:
  todo-network:
    name: todo-network
    driver: bridge